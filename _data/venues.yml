# Colors for the venue-abbreviation badges on the publications page.
# Palette: Paul Tol's "muted" qualitative scheme (the same 9 colors as
# Julia's ColorSchemes.jl `:tol_muted`), used as the base for the most
# frequent/prominent venues, with lighter tints of the same 9 hues used
# for the remaining venues so every tag stays in the same muted family.
#
# Each badge renders as a translucent tint of `rgb` (so it reads correctly
# against both the light and dark theme's page background) with a solid
# `color` border for hue identity, and text in the theme's own body-text
# color -- which is already guaranteed legible against the page background
# in both themes, rather than picking a fixed text color per venue that
# would only work in one theme.

"arXiv":
  color: "#332288" # indigo
  rgb: "51, 34, 136"

"bioRxiv":
  color: "#88CCEE" # cyan
  rgb: "136, 204, 238"

"PNAS":
  color: "#882255" # wine
  rgb: "136, 34, 85"

"Nat. Sci. Data":
  color: "#CC6677" # rose
  rgb: "204, 102, 119"

"npj Comp.":
  color: "#AA4499" # purple
  rgb: "170, 68, 153"

"Proc. B":
  color: "#117733" # green
  rgb: "17, 119, 51"

"J. R. Soc. Interface":
  color: "#999933" # olive
  rgb: "153, 153, 51"

"Sci. Advances":
  color: "#44AA99" # teal
  rgb: "68, 170, 153"

"PLoS One":
  color: "#DDCC77" # sand
  rgb: "221, 204, 119"

"JCP":
  color: "#897FBA" # light indigo
  rgb: "137, 127, 186"

"Phys. Rev. E":
  color: "#BAE1F5" # light cyan
  rgb: "186, 225, 245"

"J. Phys. A":
  color: "#93CEC4" # light teal
  rgb: "147, 206, 196"

"J. Phys. Complexity":
  color: "#75B089" # light green
  rgb: "117, 176, 137"

"Entropy":
  color: "#CE93C4" # light purple
  rgb: "206, 147, 196"

"Biophysical Journal":
  color: "#E1A6B0" # light rose
  rgb: "225, 166, 176"

"ESMTB Comms.":
  color: "#C4C489" # light olive
  rgb: "196, 196, 137"
